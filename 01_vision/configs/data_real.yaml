# 主数据集：真实拍摄 + 手工标注
#
# 本机数据放在 D:\UAV_Dataset（由 scripts/prepare_real.py 生成）：
#   D:\UAV_Dataset\images\{train,val}\*.jpg
#   D:\UAV_Dataset\labels\{train,val}\*.txt     YOLO: cls cx cy w h（0~1 归一化）
#   D:\UAV_Dataset\data.yaml                    同内容副本
#
# 换机器/换目录时只改下面这一行（绝对路径 Ultralytics 能直接用）。
path: D:/UAV_Dataset
train: images/train
val: images/val
nc: 5
names: ['peacock', 'wolf', 'monkey', 'elephant', 'tiger']
